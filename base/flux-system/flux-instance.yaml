apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.8.x"
    registry: "ghcr.io/fluxcd"
  # Включает экспорт метрики gotk_resource_info, без которой дашборд
  # Flux Cluster Stats показывает "No data" (счётчики и таблицы статуса
  # ресурсов зависят именно от этой метрики). Feature gate StatusMetrics
  # добавляется через kustomize patches, т.к. в FluxInstance нет поля featureGates.
  kustomize:
    patches:
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/args/5
            value: --feature-gates=ObjectLevelWorkloadIdentity=false,StatusMetrics=true
        target:
          labelSelector: "app in (helm-controller,kustomize-controller)"
          kind: Deployment
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/args/7
            value: --feature-gates=ObjectLevelWorkloadIdentity=false,StatusMetrics=true
        target:
          labelSelector: "app=source-controller"
          kind: Deployment
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/args/4
            value: --feature-gates=ObjectLevelWorkloadIdentity=false,StatusMetrics=true
        target:
          labelSelector: "app=notification-controller"
          kind: Deployment
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  sync:
    kind: GitRepository
    url: "https://github.com/patsevanton/fluxcd-operator-and-status-page.git"
    ref: "refs/heads/main"
    path: "./base"
