apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.8.x"
    registry: "ghcr.io/fluxcd"
  # Включает экспорт метрики gotk_resource_info, без которой дашборд
  # Flux Cluster Stats показывает "No data" (счётчики и таблицы статуса
  # ресурсов зависят именно от этой метрики).
  featureGates:
    - StatusMetrics
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  sync:
    kind: GitRepository
    url: "https://github.com/patsevanton/fluxcd-operator-and-status-page.git"
    ref: "refs/heads/main"
    path: "./base"
